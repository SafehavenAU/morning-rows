name: Check and verify Morning Rows
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: morning-rows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install locked production dependencies
        run: npm ci --omit=dev
      - name: Verify the reviewed deployed revision, not a monitoring-only commit
        run: |
          CHECK_US=$(node -p "require('./operations/us-release-review.json').enabled ? '1' : '0'") EXPECTED_REVISION=$(node -p "require('./verification/monitoring-baseline.json').identity.source_revision") npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-content-check
          path: smoke-report.json
