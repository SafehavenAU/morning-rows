name = "morning-rows"
main = "worker.js"
compatibility_date = "2026-10-16"
minify = true

# Whole-Worker safety ceiling; USA release acceptance is separately 100 ms.
[limits]
cpu_ms = 1000

[[routes]]
pattern = "morningrows.com"
custom_domain = true

[[routes]]
pattern = "www.morningrows.com"
custom_domain = true

[version_metadata]
binding = "WORKER_VERSION"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[build]
command = "node scripts/build-info.mjs"
